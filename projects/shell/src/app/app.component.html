<header class="app-header">
	<label for="lib-select">Библиотека:</label>
	<select
		id="lib-select"
		[ngModel]="selectedLib"
		(ngModelChange)="onLibChange($event)">
		<option *ngFor="let lib of libraries" [value]="lib.value">{{ lib.label }}</option>
	</select>
</header>

<main class="app-content">
	<!-- <lib-tool-templates-ang15></lib-tool-templates-ang15>-->
	<!-- ИЛИ Короче и подчёркивает, что компонент не имеет контента.
	Внутри ToolTemplatesAng15Component только <ng-template>, никакого <ng-content> нет,
	поэтому вкладывать что-то внутрь бессмысленно. -->
	<lib-tool-templates-ang15 />

	<!-- здесь будет отображаться стартовая страница выбранной библиотеки -->
	<router-outlet></router-outlet>
</main>

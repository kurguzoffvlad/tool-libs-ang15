<ng-container *ngIf="screen.state$ | async as info">
	<ng-container *ngIf="info.screen.type === ScreenEnums.Phone">
		<exch-page-data-phone
			[filters]="filters"
			[options]="options"
			[screenInfo]="info"
			[viewDataPage]="viewDataPage"
		></exch-page-data-phone>
	</ng-container>

	<ng-container *ngIf="info.screen.type === ScreenEnums.Tablet">
		<exch-page-data-tablet
			[filters]="filters"
			[options]="options"
			[screenInfo]="info"
			[viewDataPage]="viewDataPage"
		></exch-page-data-tablet>
	</ng-container>

	<ng-container *ngIf="info.screen.type === ScreenEnums.Desktop">
		<exch-page-data-desktop
			[filters]="filters"
			[options]="options"
			[screenInfo]="info"
			[viewDataPage]="viewDataPage"
		></exch-page-data-desktop>
	</ng-container>
</ng-container>

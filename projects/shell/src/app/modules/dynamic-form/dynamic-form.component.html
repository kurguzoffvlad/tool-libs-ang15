<!-- tool-dynamic-form-ang15.component.html -->
<form [formGroup]="demoForm" (ngSubmit)="onSubmit()">

	<!-- Заголовок формы -->
	<div class="form-group">
		<label>Заголовок</label>
		<input type="text" formControlName="title" class="form-control">
	</div>

	<!-- Динамический список контактов -->
	<div formArrayName="contacts">
		<h3>Контакты</h3>

		<!-- Перебираем контролы (группы) внутри FormArray -->
		<div *ngFor="let contact of contacts.controls; let i = index" [formGroupName]="i" class="contact-item">

			<div class="contact-header">
				<span>Контакт #{{ i + 1 }}</span>
				<button type="button" (click)="removeContact(i)" class="btn-remove">Удалить</button>
			</div>

			<!-- Поле Имени -->
			<div class="form-group">
				<label>Имя</label>
				<input type="text" formControlName="name" class="form-control">

				<!-- Валидация для Имени -->
				<div *ngIf="contact.get('name')?.invalid && contact.get('name')?.touched" class="error">
					Имя обязательно
				</div>
			</div>

			<!-- Поле Email -->
			<div class="form-group">
				<label>Email</label>
				<input type="email" formControlName="email" class="form-control">

				<!-- Валидация для Email -->
				<div *ngIf="contact.get('email')?.invalid && contact.get('email')?.touched" class="error">
					<span *ngIf="contact.get('email')?.hasError('required')">Email обязателен</span>
					<span *ngIf="contact.get('email')?.hasError('email')">Некорректный email</span>
				</div>
			</div>

		</div>
	</div>

	<!-- Кнопки управления -->
	<div class="actions">
		<button type="button" (click)="addContact()" class="btn-add">Добавить контакт</button>
		<button type="submit" [disabled]="demoForm.invalid" class="btn-submit">Отправить</button>
	</div>
</form>

<div>
	<h4 class="title">Паспортные данные пользователя</h4>
	<form [formGroup]="passportForm">
		<div class="form-grid">
			<tool-df [form]="passportForm" [fields]="fields" [state]="formState"></tool-df>
		</div>
	</form>
</div>
